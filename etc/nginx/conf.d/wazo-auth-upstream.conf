# Backends serving the wazo-auth REST API.
# To spread the load across extra wazo-auth-worker@<port> instances, add one
# server line per worker and reload nginx:
#     server 127.0.0.1:19497;
upstream wazo-auth {
    server 127.0.0.1:9497;

    # Idle connections parked per worker process (the default since nginx
    # 1.30). Inert without the proxy directives in wazo-auth-shared.conf.
    keepalive 32;

    # Must stay under cheroot's 10s idle expiry: nginx has to close first,
    # or a request races the backend's FIN and POST answers 502.
    keepalive_timeout 5;
}
