paths:
  /sessions:
    get:
      security:
        - wazo_auth_token: []
      produces:
        - application/json
      summary: List sessions
      description: '**Required ACL:** `auth.sessions.read`'
      operationId: listSessions
      tags:
        - sessions
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/recurse'
      - $ref: '#/parameters/order'
      - $ref: '#/parameters/direction'
      - $ref: '#/parameters/limit'
      - $ref: '#/parameters/offset'
      responses:
        '200':
          description: A list of session
          schema:
            $ref: '#/definitions/GetSessionsResult'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
  /sessions/{session_uuid}:
    delete:
      operationId: delete_session
      tags:
        - sessions
      security:
      - wazo_auth_token: []
      description: '**Required ACL**: `auth.sessions.{session_uuid}.delete`'
      parameters:
      - $ref: '#/parameters/session_uuid'
      summary: Delete a session
      responses:
        '204':
          description: The session has been removed
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
parameters:
  session_uuid:
    name: session_uuid
    in: path
    type: string
    description: The UUID of the session
    required: true
definitions:
  GetSessionsResult:
    type: object
    properties:
      total:
        type: integer
        description: The number of sessions.
      filtered:
        type: integer
        description: The number of sessions matching the searched term.
      items:
        type: array
        items:
          $ref: '#/definitions/SessionResult'
        description: A paginated list of sessions
    required:
    - filtered
    - total
    - items
  SessionResult:
    type: object
    description: |
      A session is a proxy for the token that created it: it exposes the
      metadata of that token without exposing the token itself. A session
      references exactly one token.
    properties:
      uuid:
        type: string
        description: The UUID of the session
      user_uuid:
        type: string
        description: The UUID of the user that owns the session, `null` when the token is not associated to a user
      tenant_uuid:
        type: string
        description: The UUID of the tenant of the session
      mobile:
        type: boolean
        description: Whether the session has been created from a mobile application
      user_agent:
        type: string
        description: The user agent of the client that created this session
      remote_addr:
        type: string
        description: The IP address of the client that created this session
      acl:
        type: array
        items:
          type: string
        description: The access control list of the token of this session
      issued_at:
        type: string
        format: date-time
        description: The date and time at which the token of this session has been issued, in UTC
      expires_at:
        type: string
        format: date-time
        description: The date and time at which the token of this session expires, in UTC
      client_id:
        type: string
        description: The `client_id` of the refresh token that created this session, `null` when the session has been created without a refresh token
