services:
  sync:
    depends_on:
      - auth
      - oauth2sync
      - postgres
      - rabbitmq
      - smtp
    environment:
      TARGETS: "auth:9497 oauth2sync:80 postgres:5432 rabbitmq:5672 smtp:25"

  auth:
    volumes:
      - "./etc/wazo-auth/conf.d/asset.base.yml:/etc/wazo-auth/conf.d/asset.base.yml"
      - "./etc/wazo-auth/conf.d/asset.salesforce.yml:/etc/wazo-auth/conf.d/asset.salesforce.yml"
